<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Pantheon</title>
    <script>
      // The first frame is already in the stored theme; App keeps it in step afterwards.
      (function () {
        var theme = 'system';
        var accent = null;
        try {
          theme = localStorage.getItem('pantheon.theme');
          accent = JSON.parse(localStorage.getItem('pantheon.accent.v1') || 'null');
        } catch (e) {}
        if (accent && accent.css) {
          var ink = document.createElement('style');
          ink.id = 'pt-accent';
          ink.textContent = accent.css;
          document.head.append(ink);
        }
        if (
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        )
          document.documentElement.classList.add('dark');
      })();
    </script>
    <style>
      html {
        background: #f3f3f1;
      }
      html.dark {
        background: #0e0e0d;
      }
    </style>
  </head>
  <body class="pt" spellcheck="false">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
