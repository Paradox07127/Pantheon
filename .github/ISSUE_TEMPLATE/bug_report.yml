name: Bug report
description: Something in Pantheon does not work as it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Pantheon version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: macOS 26.1 arm64
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Claude Code
        - Codex
        - ACP agent
        - None
    validations:
      required: true
  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      description: For an ACP agent, also give its name.
  - type: textarea
    id: steps
    attributes:
      label: What you did
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
  - type: checkboxes
    id: redacted
    attributes:
      label: Privacy
      options:
        - label: I removed tokens and private paths from the logs.
          required: true
